<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>설이네 타로</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
/* VOICE: 조용하고 신비로운 한옥 점집. 설이는 점잖은 척하는 강아지 도사.
   IDEA: 밤의 상담소 — 남색 비단 탁자, 촛불, 수정구, 금빛 마법진, 한복 입은 설이.
   PICTURE: 전체 화면 3D 상담소. 설이가 카드를 섞고, 사용자가 직접 고른다.
   COLOUR and TYPE: 깊은 남색·검정 + 금속 금빛 + 한복 미색. 제목 Gowun Batang, 본문 Gowun Dodum.
   LAYOUT: 3D 장면이 바탕, 위 안내 한 줄, 아래 시트(선택·결과). 세로 9:16 우선. */
:root{color-scheme:dark;--ink:#f3ecdc;--soft:#b8b2c8;--gold:#e2b866;--gold2:#f5d995;--navy:#141a33;--panel:rgba(16,18,38,.9);--line:rgba(226,184,102,.35);--cream:#f4ecdb}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:#07080f;color:var(--ink);font:16px/1.6 "Gowun Dodum",system-ui,sans-serif;overflow:hidden}
#flash{position:fixed;inset:0;pointer-events:none;opacity:0;mix-blend-mode:screen}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(0,0,0,.55))}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.serif{font-family:"Gowun Batang",serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;border-radius:14px;min-height:44px}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.gold{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#2a1f08;font-weight:700}
.line{background:rgba(255,255,255,.04);border:1px solid var(--line)}
/* 시작 화면 */
#start{position:fixed;inset:0;display:grid;place-items:end center;padding:0 20px calc(40px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(7,8,15,0) 40%,rgba(7,8,15,.85) 75%)}
#start[hidden]{display:none}
#start .box{text-align:center;max-width:420px}
#start .en{letter-spacing:.3em;color:var(--gold);font-size:13px;margin:0}
#start h1{font-size:48px;line-height:1.05;margin:6px 0 8px;color:var(--cream);text-shadow:0 0 24px rgba(226,184,102,.45)}
#start p{color:var(--soft);margin:0 0 20px}
#start .gold{width:100%;font-size:19px;min-height:56px}
/* 위 안내 */
#hint{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);max-width:92vw;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:15px;text-align:center;display:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#say{position:fixed;left:50%;transform:translateX(-50%);top:calc(58px + env(safe-area-inset-top));max-width:min(86vw,420px);background:var(--cream);color:#2a2238;border-radius:16px;padding:8px 14px;font-size:15px;text-align:center;opacity:0;transition:opacity .35s;pointer-events:none}
#say.on{opacity:1}
/* 아래 시트 */
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:78vh;overflow:auto;background:var(--panel);backdrop-filter:blur(10px);border-top:1px solid var(--line);border-radius:22px 22px 0 0;padding:16px max(4vw,16px) calc(18px + env(safe-area-inset-bottom));display:none}
.sheet.on{display:block;animation:up .45s ease-out}
.wrap{max-width:560px;margin:0 auto}
.sheet h2{font-family:"Gowun Batang",serif;font-size:22px;margin:4px 0 10px;color:var(--cream)}
.lab{font-size:14px;color:var(--soft);margin:12px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:rgba(255,255,255,.04);border:1px solid var(--line);padding:0 13px;font-size:15px}
.chip[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:#2a1f08}
.chip small{display:block;font-size:12px;opacity:.75;line-height:1.2}
.mode{padding:6px 12px;text-align:left}
input[type=text]{width:100%;font:inherit;font-size:16px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--ink);min-height:44px}
.go{width:100%;margin-top:16px;font-size:18px;min-height:52px}
#pickbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));display:none;gap:8px}
#pickbar button{padding:0 18px}
/* 결과 */
.sum{background:rgba(226,184,102,.1);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:12px}
.q{color:var(--soft);font-size:14px;margin:0 0 4px}
.item{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;padding:12px 0;border-top:1px solid rgba(255,255,255,.08)}
.thumb{width:64px;height:100px;border-radius:8px;object-fit:cover;border:1px solid var(--line)}
.thumb.rev{transform:rotate(180deg)}
.pos{font-size:13px;color:var(--gold)}
.nm{font-family:"Gowun Batang",serif;font-size:18px;font-weight:700}
.dir{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:2px;font-family:"Gowun Dodum"}
.kw{font-size:13px;color:var(--soft)}
.item p,.blk p{margin:4px 0 0}
.blk{padding:10px 0;border-top:1px solid rgba(255,255,255,.08)}
.blk b{color:var(--gold2);font-weight:400;font-family:"Gowun Batang",serif}
.last{background:var(--cream);color:#2a2238;border-radius:16px;padding:12px 14px;margin-top:10px}
.row{display:flex;gap:8px;margin-top:14px}.row button{flex:1}
.hist{padding:10px 0;border-top:1px solid rgba(255,255,255,.08);width:100%;text-align:left;background:none;border-radius:0}
.fine{font-size:13px;color:var(--soft);margin:12px 0 0}
#topbtn{position:fixed;right:12px;top:calc(10px + env(safe-area-inset-top));display:none;background:var(--panel);border:1px solid var(--line);padding:0 12px;font-size:14px}
#loading{position:fixed;inset:0;display:grid;place-items:center;color:var(--soft);font-size:15px}
#result{max-height:60vh;transition:max-height .35s}#result.min{max-height:96px;overflow:hidden}
.peek{float:right;background:rgba(255,255,255,.06);border:1px solid var(--line);font-size:14px;padding:0 12px;min-height:40px}
#snd{position:fixed;left:12px;top:calc(10px + env(safe-area-inset-top));display:none;background:var(--panel);border:1px solid var(--line);padding:0 12px;font-size:14px}
.ai{margin-top:12px;border:1px solid var(--line);border-radius:16px;padding:12px 14px;background:rgba(255,255,255,.03)}
.ai p{white-space:pre-wrap;margin:6px 0 0}
.ai .wait{color:var(--soft);font-size:14px}
.row.wrap2{flex-wrap:wrap}.row.wrap2 button{flex:1 1 40%}
#focus{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,20px);width:min(92vw,520px);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:12px 16px;opacity:0;pointer-events:none;transition:opacity .35s,transform .35s;text-align:center}
#focus.on{opacity:1;transform:translate(-50%,0)}
#focus .fp{font-size:13px;color:var(--gold)}#focus .fn{font-family:"Gowun Batang",serif;font-size:22px;font-weight:700}#focus p{margin:4px 0 0;font-size:15px}#focus .ft{font-size:12px;color:var(--soft);margin-top:6px}
#skipBtn{position:fixed;right:12px;top:calc(56px + env(safe-area-inset-top));display:none;background:var(--panel);border:1px solid var(--line);padding:0 12px;font-size:14px}
.pred{border:1px solid var(--gold);border-radius:16px;padding:12px 14px;margin-bottom:12px;background:linear-gradient(180deg,rgba(226,184,102,.16),rgba(226,184,102,.04))}
.pred b.serif{color:var(--gold2)}.pred .pv{font-size:22px;margin:6px 0 2px;font-family:"Gowun Batang",serif}.pred p{margin:4px 0}
.gauge{display:flex;align-items:center;gap:6px;margin:8px 0 4px}.gauge i{width:22px;height:10px;border-radius:6px;background:rgba(255,255,255,.12)}.gauge i.on{background:var(--gold)}.gauge span{font-size:14px;color:var(--soft);margin-left:6px}
.ym{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 10px;margin-top:8px;font-size:14px}.ym b{color:var(--gold2);font-weight:400}
#guide{position:fixed;inset:0;background:rgba(5,6,14,.72);display:grid;place-items:center;padding:20px;z-index:5}#guide[hidden]{display:none}
.gbox{max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px 18px 14px}.gbox p{margin:8px 0}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.sheet.on{animation:none}#say{transition:none}}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="vig"></div>
<div id="flash"></div>
<div id="loading">상담소 불을 켜는 중…</div>
<div id="hint"></div>
<div id="say"></div>
<button id="topbtn">상담 기록</button>
<button id="snd" aria-pressed="true">소리 켬</button>
<div id="guide" hidden><div class="gbox"><b class="serif" style="font-size:22px;color:var(--cream)">설이네 타로 이용법</b>
  <p>① 궁금한 주제와 방식을 골라요</p><p>② 설이가 카드를 섞으면, 손가락으로 훑다가 끌리는 카드에서 떼요</p><p>③ 카드가 한 장씩 뒤집히며 설이가 풀어 줘요</p>
  <p class="kw">매일 <b>🌙 오늘의 카드</b>로 출석 도장도 모아 보세요.</p><button class="gold go" id="guideOk">알겠어요</button></div></div>
<section id="start" hidden>
  <div class="box">
    <p class="en">DOG TAROT</p>
    <h1 class="serif">설이네 타로</h1>
    <p>당신의 운명의 발자국을 따라가 보세요.</p>
    <button class="gold" id="startBtn">시작하기</button>
    <button class="line" id="dailyBtn" style="width:100%;margin-top:10px;font-size:16px">🌙 오늘의 카드 <span id="streak" class="kw"></span></button>
  </div>
</section>
<section class="sheet" id="setup"><div class="wrap">
  <h2>무엇이 궁금하신가요?</h2>
  <div class="lab">타로 방식</div><div class="chips" id="modes"></div>
  <div class="lab">상담 주제</div><div class="chips" id="cats"></div>
  <div class="lab">카드 방향</div><div class="chips" id="revs"><button class="chip" data-r="1">역방향 포함 <small>진짜 타로처럼 거꾸로 나올 수 있어요</small></button><button class="chip" data-r="0">정방향만 <small>처음이라면 편해요</small></button></div>
  <div class="lab">직접 질문 (선택)</div><input type="text" id="qin" maxlength="60" placeholder="예: 이번 달에 이직해도 될까요?"><div class="chips" id="qsug" style="margin-top:8px"></div>
  <button class="gold go" id="shuffleBtn">설이에게 카드 섞어 달라고 하기</button>
</div></section>
<div id="focus"><div class="fp" id="fPos"></div><div class="fn"><span id="fName"></span><span class="dir" id="fDir"></span></div><p id="fText"></p><div class="ft">화면을 누르면 다음 카드</div></div>
<button id="skipBtn">바로 결과 보기</button>
<div id="pickbar"><button class="gold" id="readBtn">해석 보기</button></div>
<section class="sheet" id="result"><div class="wrap" id="resultIn"></div></section>
<section class="sheet" id="history"><div class="wrap" id="histIn"></div></section>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
{
/* ============ 1. 카드 데이터 (78장) ============ */
// 메이저: [기호, 이름, 키워드, 정방향, 역방향, 연애, 금전, 직장, 인간관계, 긍정, 주의, 조언]
const MAJ=[
['☆','바보','시작 · 자유 · 모험','가벼운 마음으로 새 길에 들어서는 때예요.','준비 없이 뛰어들어 발이 꼬일 수 있어요.','부담 없는 새 만남이 설렘을 줘요.','새 기회가 보이지만 충동 지출은 조심해요.','새로운 도전이나 낯선 업무가 길을 열어요.','처음 보는 사람과 의외로 잘 통해요.','두려움보다 호기심이 앞서요.','발밑을 살피지 않으면 넘어져요.','작게, 지금 바로 시작해 보세요.'],
['✦','마법사','재능 · 실행 · 의지','가진 재주로 원하는 걸 만들어 낼 수 있어요.','말만 앞서고 손이 안 따라갈 수 있어요.','먼저 표현하는 쪽이 흐름을 쥐어요.','능력을 돈으로 바꿀 기회가 와요.','기획한 일을 실제로 옮길 때예요.','당신의 말솜씨가 사람을 모아요.','필요한 도구는 이미 손에 있어요.','과장된 약속은 신뢰를 깎아요.','미뤄 둔 한 가지를 오늘 실행하세요.'],
['☾','여사제','직감 · 비밀 · 고요','말보다 느낌이 정답에 가까운 때예요.','감을 무시하거나 숨긴 마음이 엉켜요.','상대는 마음을 쉽게 드러내지 않아요. 조용히 지켜보세요.','서두르지 말고 정보를 더 모으세요.','드러나지 않은 사정이 있어요. 관찰이 먼저예요.','비밀을 지켜 주는 사람이 신뢰를 얻어요.','당신의 직감은 꽤 정확해요.','혼자 짐작만 키우면 오해가 생겨요.','결정 전에 하루만 조용히 생각해 보세요.'],
['❀','여황제','풍요 · 돌봄 · 매력','넉넉함과 따뜻함이 흘러드는 때예요.','지나친 돌봄이 나를 지치게 해요.','다정함이 가장 큰 매력이 돼요.','수입과 여유가 늘어나는 흐름이에요.','공들여 키운 일이 열매를 맺어요.','사람들이 당신 곁에서 편안해해요.','작은 기쁨이 계속 들어와요.','남 챙기다 나를 잊지 마세요.','오늘은 나에게도 맛있는 걸 선물하세요.'],
['♜','황제','질서 · 책임 · 안정','틀을 세우면 일이 단단해지는 때예요.','고집과 통제가 관계를 딱딱하게 해요.','확실한 태도가 마음을 움직여요.','계획적인 관리가 돈을 지켜요.','리더십을 발휘할 자리가 생겨요.','기준이 분명한 사람이 존중받아요.','정리하면 운이 열려요.','내 방식만 고집하면 사람이 떠나요.','할 일 목록부터 정리해 보세요.'],
['✚','교황','조언 · 전통 · 배움','믿을 만한 가르침이 길을 비춰요.','형식에만 매여 본질을 놓쳐요.','주변 소개나 오래된 인연이 이어져요.','검증된 방법이 안전해요.','선배나 멘토의 조언이 도움이 돼요.','함께 지키는 약속이 관계를 묶어 줘요.','물어보면 답이 쉽게 나와요.','남의 기준에 나를 다 맞추진 마세요.','믿을 만한 사람에게 한 번 물어보세요.'],
['♡','연인','선택 · 사랑 · 조화','마음이 뛰는 쪽을 고르는 때예요.','망설임이나 엇갈린 마음이 생겨요.','설레는 기운이 가득해요. 마음을 표현해도 좋아요.','두 갈래 중 가치에 맞는 쪽을 고르세요.','함께 일할 좋은 짝이 생겨요.','마음이 맞는 사람과 깊어져요.','진심이 통하는 때예요.','양쪽을 다 잡으려다 둘 다 놓쳐요.','머리보다 마음이 가리키는 쪽을 보세요.'],

w1:['빛 속에 떠오른 지팡이를 올려다보는 설이','새 불씨가 막 붙었어요. 시작하고 싶은 그 마음, 진짜예요.','불은 붙었는데 장작이 모자라요. 시작이 자꾸 미뤄지는 기운이에요.','요즘 "이거 한번 해볼까?" 하고 품어 둔 게 하나 있죠?','확 끌리는 새 인연이에요. 먼저 다가가도 좋아요.','새 프로젝트나 도전 제안이 들어오기 좋은 때예요.','새 수입 아이디어가 생겨요. 작게 시험해 보세요.','새 모임에서 활기를 얻어요.','오늘 첫 행동 딱 하나만 하세요.',2],
w2:['두 지팡이를 들고 먼 곳을 바라보는 설이','지금 자리에 머물기엔 마음이 이미 더 넓은 곳을 보고 있어요.','계획만 세우고 발이 안 떨어져요. 두려움이 발목을 잡아요.','머릿속에 두 갈래 길을 두고 몇 번이나 저울질했죠?','관계를 더 키울지 고민 중이에요. 원하는 걸 먼저 정하세요.','이직이나 확장을 진지하게 그려 볼 때예요.','큰 계획 전에 계산부터 하세요.','함께 갈 사람을 고르는 중이에요.','기준 하나를 종이에 적어 보세요.',1],
w3:['세 지팡이를 세우고 수평선을 바라보는 설이','기다리던 배가 들어오고 있어요. 준비한 것이 넓게 퍼져 나가요.','기대보다 소식이 늦어요. 조급해하면 일을 그르쳐요.','답을 기다리는 일이 하나 있죠? 생각보다 멀지 않아요.','멀리 있는 사람, 혹은 앞날을 같이 그리는 관계예요.','확장·해외·협업 운이 좋아요.','들인 노력이 돌아오기 시작해요.','넓은 인맥이 도움이 돼요.','멀리 보고 한 걸음만 더 가세요.',2],
w4:['네 지팡이 아래서 편히 쉬는 설이','축하할 일이 있어요. 마음 놓고 쉬어도 되는 안정의 기운이에요.','겉은 평화로운데 속이 편치 않아요. 집안이나 모임에 작은 금이 갔어요.','최근 "이제 좀 자리 잡았다" 싶은 순간이 있었죠?','관계가 한 단계 안정돼요. 약속 소식이 좋아요.','일이 일단락돼요. 작은 성과를 축하하세요.','안정적인 흐름이에요.','가족·친구와 따뜻한 자리가 생겨요.','고생한 나를 위해 작은 축하를 하세요.',2],
w5:['비바람 속 흩어진 지팡이 사이의 설이','여기저기 부딪히는 경쟁과 의견 충돌의 기운이에요.','다툼이 잦아들고 있어요. 이제 정리할 때예요.','요즘 말이 엇갈려서 피곤했던 일 있었죠?','사소한 말다툼이 커질 수 있어요. 이기려 하지 마세요.','경쟁이 치열해요. 실력으로 보여 줄 때예요.','돈 문제로 의견이 갈릴 수 있어요.','단체 안에서 목소리가 엇갈려요.','말싸움 대신 하루 쉬었다 이야기하세요.',-1],
w6:['참새에게 지팡이를 건네는 설이','인정과 승리의 카드예요. 당신의 노력이 드디어 눈에 띄어요.','칭찬이 기대만큼 안 와서 서운해요. 남의 시선에 너무 매이지 마세요.','누군가에게 인정받고 싶은 마음, 요즘 꽤 크죠?','당신 매력이 빛나요. 상대가 먼저 알아봐요.','승진·합격·좋은 평가 소식이 가까워요.','보상이 들어와요.','주변이 당신을 응원해요.','잘한 건 잘했다고 스스로 말해 주세요.',2],
w7:['언덕 위에서 지팡이를 막아서는 설이','지킬 것을 지키는 용기의 카드예요. 버티면 자리를 지켜요.','지쳐서 물러서고 싶어요. 모든 싸움에 응할 필요는 없어요.','요즘 혼자 여러 사람을 상대하는 느낌이었죠?','관계를 지키려면 당신이 먼저 확신을 보여야 해요.','견제가 있어도 실력이 앞서요.','지출 압박이 와도 원칙을 지키세요.','내 입장을 분명히 할 때예요.','꼭 지킬 것 하나만 정하세요.',1],
w8:['하늘로 날아가는 여덟 지팡이와 달리는 설이','일이 빠르게 움직여요. 기다리던 연락이 한꺼번에 몰려와요.','일정이 꼬이고 소식이 엇갈려요. 서두르면 실수해요.','최근 갑자기 일이 몰리거나 연락이 늘지 않았나요?','연락이 빨라지고 진도가 나가요.','빠른 결정, 출장, 바쁜 일정이에요.','돈이 빨리 들어오고 빨리 나가요.','소식이 빠르게 퍼져요.','답장은 미루지 말고 오늘 하세요.',2],
w9:['지팡이에 둘러싸여 지친 듯 버티는 설이','거의 다 왔어요. 지쳤지만 마지막 고비 하나만 남았어요.','의심과 피로가 쌓였어요. 잠깐 내려놓아도 괜찮아요.','"또 상처받으면 어쩌지" 하는 경계심이 있죠?','예전 상처 때문에 마음 문을 반만 열어 두었어요.','끝이 보이는 일이에요. 버티면 끝내요.','아껴 온 게 곧 빛을 봐요.','믿을 사람과 아닌 사람을 가리는 중이에요.','오늘은 충분히 자고 내일 다시 가세요.',1],
w10:['무거운 지팡이 열 개를 지고 마을로 가는 설이','책임이 너무 많아요. 혼자 다 지고 가는 무게예요.','짐을 내려놓을 때가 왔어요. 거절해도 괜찮아요.','요즘 "나만 이렇게 힘든가" 싶은 날 있었죠?','관계에서 당신만 애쓰고 있지 않은지 보세요.','업무 과부하예요. 나눠 맡기세요.','지출 부담이 무거워요. 줄일 것을 고르세요.','부탁을 다 들어주다 지쳐요.','짐 하나를 오늘 내려놓으세요.',-1],
w11:['지팡이를 신기하게 바라보는 꼬마 설이','설레는 소식과 새로운 호기심이 찾아와요.','의욕은 큰데 끝맺음이 약해요. 소식이 늦어져요.','새로 배우고 싶은 게 생겼죠?','풋풋한 연락이나 고백 소식이 와요.','새로운 배움이나 제안 소식이에요.','작은 부수입 기회가 보여요.','새 사람에게 좋은 자극을 받아요.','궁금한 건 오늘 바로 찾아보세요.',1],
w12:['지팡이를 들고 말을 달리는 기사 설이','열정적으로 돌진하는 기운이에요. 움직이면 바로 결과가 나와요.','성급하게 저질렀다 후회해요. 방향부터 확인하세요.','생각보다 몸이 먼저 나가는 편이죠?','뜨겁게 다가오는 사람이 있어요. 속도 조절은 필요해요.','이사·이직·출장처럼 움직이는 일이에요.','충동 지출을 조심하세요.','새로운 사람을 빨리 사귀어요.','출발 전에 지도를 한 번만 보세요.',1],
w13:['지팡이를 든 당당한 여왕 설이','자신감과 매력이 가장 빛나는 때예요.','질투나 예민함이 올라와요. 비교를 멈추세요.','당신, 사실 주변에서 은근히 눈에 띄는 사람이죠?','당신이 주도권을 쥐어요. 매력을 보여 줄 때예요.','리더십을 인정받아요.','스스로 버는 힘이 강해요.','모임의 중심이 돼요.','오늘은 나를 가꾸는 데 시간을 쓰세요.',2],
w14:['왕좌에서 지팡이를 쥔 왕 설이','큰 그림을 그리고 이끄는 리더의 기운이에요.','고집과 독단이 일을 막아요. 남의 말도 들으세요.','결정은 결국 당신이 내려야 하는 상황이죠?','책임감 있는 사람이 다가오거나, 당신이 관계를 이끌어요.','사업·창업 운이 강해요.','큰 결정은 계획대로 하세요.','사람들이 당신 판단을 믿어요.','결정을 미루지 말고 정하세요.',2],
c1:['구름 위 빛 속의 청자 잔을 올려다보는 설이','마음이 넘치도록 차오르는 사랑과 감정의 시작이에요.','마음이 막혀 표현이 안 돼요. 감정을 꾹 누르고 있어요.','요즘 누군가 생각만 해도 마음이 몽글해지죠?','새로운 사랑, 혹은 관계의 새 출발이에요.','좋아하는 일을 시작할 기운이에요.','마음 쓰는 곳에 돈도 따라와요.','따뜻한 정을 나눌 사람이 생겨요.','느끼는 마음을 한 줄로 표현하세요.',2],
c2:['두 잔을 들고 누군가를 바라보는 설이','서로 마음이 통하는 짝의 카드예요.','작은 오해로 마음이 엇갈려요. 대화가 필요해요.','요즘 유독 "통한다" 느낀 사람이 있죠?','썸·고백·화해에 아주 좋은 카드예요.','좋은 파트너를 만나요.','함께하면 이득이에요.','1대1 관계가 깊어져요.','먼저 안부를 물어보세요.',2],
c3:['세 잔을 세우고 축하하는 설이','함께 웃고 축하하는 즐거운 기운이에요.','모임이 지나치거나 제3자가 끼어들어요.','최근 친구들과 실컷 웃은 게 오랜만이었죠?','즐거운 만남, 소개팅 운이 좋아요. 다만 제3자는 조심하세요.','팀워크로 성과를 내요.','축하 자리 지출이 늘어요.','친구 운이 최고예요.','좋은 사람들과 밥 한 끼 하세요.',2],
c4:['네 잔 아래서 시큰둥하게 쉬는 설이','마음이 지루하고 시큰둥해요. 눈앞의 기회를 못 보고 있어요.','다시 관심이 살아나요. 새 제안에 눈이 떠져요.','요즘 뭘 해도 재미없다는 느낌이었죠?','상대 마음이 식은 게 아니라 지친 거예요.','권태기예요. 새 자극이 필요해요.','놓치고 있는 기회가 있어요.','초대를 거절하고 싶어도 한 번은 가 보세요.','평소 안 하던 일 하나를 해 보세요.',0],
c5:['쓰러진 잔들 사이에서 비를 맞는 설이','엎질러진 것에 마음이 아파요. 하지만 뒤에 아직 남은 잔이 있어요.','슬픔에서 빠져나오는 중이에요. 다시 일어서요.','아직 마음에 남은 아쉬운 일 하나 있죠?','서운함이나 이별의 기운이지만, 남은 마음도 있어요.','실수에 너무 오래 머물지 마세요.','손실이 있어도 회복할 수 있어요.','서운한 사람이 있어요.','뒤에 남은 두 잔을 보세요. 아직 있어요.',-1],
c6:['참새에게 잔을 건네는 설이','따뜻한 추억과 옛 인연의 카드예요.','과거에 너무 매여 있어요. 지금을 보세요.','요즘 옛날 생각이 자주 나지 않았나요?','옛 연인·첫사랑 소식, 재회 기운이 있어요.','예전 인맥이 도움을 줘요.','작은 선물 같은 따뜻한 돈이에요.','오랜 친구와 다시 연락이 닿아요.','그리운 사람에게 안부를 보내세요.',1],
c7:['일곱 잔 앞에서 고민하는 설이','선택지가 많아 마음이 흔들려요. 환상과 현실을 구분해야 해요.','안개가 걷히고 정말 원하는 게 보여요.','이것도 좋고 저것도 좋아서 결정을 못 하고 있죠?','상대에 대한 상상이 커요. 현실을 확인하세요.','여러 제안 중 진짜를 골라야 해요.','너무 좋은 조건은 의심하세요.','겉모습에 속지 마세요.','목록을 적고 셋만 남기세요.',0],
c8:['잔 여덟을 두고 길을 떠나는 설이','마음이 떠난 곳을 정리하고 더 깊은 것을 찾아 떠나요.','떠나지도 머물지도 못하고 망설여요.','"이제 그만해야 하나" 고민하는 게 있죠?','채워지지 않는 관계라면 떠날 용기가 필요해요.','이직이나 전환을 진지하게 생각할 때예요.','의미 없는 지출을 끊어요.','맞지 않는 모임과 거리를 둬요.','내가 정말 원하는 걸 한 문장으로 써 보세요.',-1],
c9:['아홉 잔에 둘러싸여 흐뭇한 설이','소원 카드예요! 바라던 것이 이루어지는 만족의 기운이에요.','겉으론 다 가졌는데 속이 허전해요.','작게 빌어 둔 소원 하나 있죠? 바로 그 카드예요.','바라던 관계가 이루어져요.','원하던 결과가 나와요.','여유가 생기는 흐름이에요.','즐거운 자리가 많아요.','소원을 구체적으로 말해 보세요.',2],
c10:['무지개 같은 열 잔 아래 행복한 설이','가족과 사랑이 꽉 찬 행복의 완성이에요.','겉보기와 달리 집안에 작은 불화가 있어요.','결국 당신이 바라는 건 "편안한 우리"죠?','오래가는 관계예요. 미래를 약속하는 이야기도 좋아요.','일과 삶의 균형이 맞아요.','가정 경제가 안정돼요.','가족 운이 좋아요.','가족에게 고맙다고 말하세요.',2],
c11:['잔을 신기하게 들여다보는 꼬마 설이','설레는 감정의 소식, 귀여운 고백이 와요.','감정 기복이 커요. 서운함이 쉽게 드러나요.','누가 보낸 메시지에 혼자 웃은 적 있죠?','귀여운 연락, 썸의 시작이에요.','창의적인 아이디어가 떠올라요.','기분 따라 쓰는 돈을 조심하세요.','다정한 사람이 다가와요.','떠오른 아이디어를 메모하세요.',1],
c12:['잔을 들고 말 탄 기사 설이','로맨틱한 제안을 들고 오는 사람이에요.','말만 달콤하고 행동이 없어요.','누군가 은근히 다가오는 기척을 느꼈죠?','고백이나 데이트 신청이 와요.','좋은 제안이 들어와요.','감성 소비를 조심하세요.','매너 좋은 사람을 만나요.','말보다 행동을 보세요.',1],
c13:['잔을 소중히 든 여왕 설이','따뜻하게 품어 주는 공감의 힘이 커요.','남의 감정까지 떠안아 지쳤어요.','주변에서 고민 상담을 자주 받죠?','다정함이 최고의 매력이에요.','사람을 돌보는 일에서 빛나요.','감으로 쓰지 말고 기록하세요.','믿고 기대는 사람이 많아요.','오늘은 나부터 위로하세요.',1],
c14:['잔을 든 왕 설이','감정을 잘 다스리는 어른스러운 기운이에요.','참았던 감정이 터지거나 감정을 숨겨요.','속은 끓어도 겉으론 괜찮은 척하고 있죠?','듬직하고 따뜻한 사람이에요.','갈등을 차분히 정리해요.','안정적으로 관리해요.','중재자 역할을 맡아요.','참지 말고 차분히 말하세요.',1],
s1:['빛 속에 떠오른 칼을 올려다보는 설이','생각이 번쩍 맑아져요. 진실이 드러나고 결단이 서요.','생각이 엉켜 판단이 흐려요. 말이 날카롭게 나가요.','요즘 "이제 확실히 알겠다" 싶은 순간이 있었죠?','솔직한 대화가 관계를 정리해 줘요.','명확한 결정, 시험과 면접에 강해요.','숫자를 똑바로 보세요.','할 말은 해야 할 때예요.','결정 하나를 오늘 내리세요.',1],
s2:['두 칼을 쥐고 고민하는 설이','결정을 미루고 눈을 가리고 있어요. 평화로워 보여도 속은 긴장 상태예요.','미뤄 온 결정을 내려야 할 때가 왔어요.','모르는 척 넘기고 있는 문제 하나 있죠?','애매한 관계예요. 마음을 정해야 해요.','두 선택지 사이에 멈춰 있어요.','미뤄 둔 지출이 쌓여요.','중간에 끼어 곤란해요.','눈가리개를 벗고 사실을 확인하세요.',0],
s3:['비 속에서 칼 세 자루를 마주한 설이','마음이 아픈 카드예요. 상처가 된 말이나 이별의 기운이 있어요.','아픔이 아물기 시작해요. 털어놓으면 가벼워져요.','누군가의 말 한마디가 아직 가슴에 걸려 있죠?','서운함이나 삼각관계, 이별을 조심해요.','비판에 너무 상처받지 마세요.','아까운 손실이 있어요.','말로 상처를 주고받아요.','울고 싶으면 울어도 괜찮아요.',-2],
s4:['칼 아래 조용히 누워 쉬는 설이','쉬어야 회복돼요. 잠시 멈춤이 필요한 때예요.','쉬지 못하고 불안해요. 몸이 신호를 보내요.','요즘 제대로 쉰 날이 거의 없죠?','관계도 잠깐 쉬어 가요. 재촉하지 마세요.','휴가와 재충전이 먼저예요.','큰 결정은 잠시 미뤄요.','혼자만의 시간이 필요해요.','오늘은 휴대폰을 멀리 두고 주무세요.',0],
s5:['흩어진 칼 사이에 선 설이','이겨도 찜찜한 다툼이에요. 자존심 싸움을 조심하세요.','다툼 뒤에 화해할 기회가 와요.','이기고도 마음이 불편했던 일 있었죠?','말다툼에서 이기려 하면 관계를 잃어요.','경쟁이 지나쳐요. 공정하게 가세요.','손해 보는 거래를 조심하세요.','뒷말이 오가는 모임을 조심하세요.','먼저 "미안해"라고 해 보세요.',-1],
s6:['칼을 싣고 잔잔한 물을 건너는 설이','힘든 곳을 지나 조용한 곳으로 옮겨 가요. 회복의 이동이에요.','떠나고 싶은데 발목이 잡혀요.','요즘 "여기서 벗어나고 싶다" 생각했죠?','힘든 시기를 지나 관계가 잔잔해져요.','이동이나 전환이 도움이 돼요.','천천히 안정으로 가요.','새 환경에서 숨통이 트여요.','짧은 여행이나 산책을 다녀오세요.',1],
s7:['몰래 칼을 챙기는 설이','꾀로 일을 풀려는 기운이에요. 누군가 숨긴 것이 있어요.','숨겨진 게 드러나요. 정면으로 가는 게 나아요.','누군가 뭔가 숨기는 느낌, 받았죠?','상대가 다 말하지 않았어요. 확인하세요.','전략은 좋지만 편법은 금물이에요.','속임수와 사기를 조심하세요.','말을 다 믿지 마세요.','계약서와 약속을 꼼꼼히 보세요.',-1],
s8:['칼에 둘러싸여 멈춰 선 설이','스스로 만든 틀에 갇혀 있어요. 사실 나갈 길이 있어요.','갇힌 생각에서 풀려나요. 해결책이 보여요.','"어쩔 수 없잖아" 하며 포기한 게 있죠?','두려움 때문에 다가가지 못해요.','제약이 많지만 출구가 생각보다 가까워요.','막혀 보여도 방법이 있어요.','남의 시선이라는 감옥이에요.','할 수 있는 것 하나만 적어 보세요.',-1],
s9:['밤에 깨어 걱정에 잠긴 설이','걱정으로 잠 못 드는 밤이에요. 실제는 생각보다 덜 나빠요.','걱정이 조금씩 풀려요. 털어놓으면 나아져요.','요즘 밤에 생각이 많아 잠이 안 오죠?','혼자 상상한 걱정이 커요.','실수할까 걱정하느라 지쳐요.','돈 걱정이 커 보이지만 풀려요.','믿을 사람에게 털어놓으세요.','걱정을 종이에 적고 덮어 두세요.',-1],
s10:['칼이 꽂힌 땅 너머로 해 뜨는 걸 보는 설이','바닥을 찍었어요. 이제 더 나빠질 건 없고, 해가 떠요.','최악은 지났어요. 천천히 회복돼요.','"이건 끝났다" 싶은 일이 있었죠?','완전히 끝난 흐름이에요. 정리가 새 시작이에요.','한 단계가 끝나요. 미련을 두지 마세요.','손실을 인정하고 다시 가요.','맞지 않는 관계가 정리돼요.','끝을 인정하고 새 계획을 세우세요.',-2],
s11:['칼을 쥐고 주변을 살피는 꼬마 설이','눈치 빠른 호기심의 기운이에요. 새로운 정보가 들어와요.','말이 앞서거나 뒷말을 조심해야 해요.','요즘 이것저것 알아보는 중이죠?','상대를 탐색하는 중이에요.','정보 수집과 공부에 좋아요.','정보를 확인하고 움직이세요.','말조심하세요.','소문보다 사실을 확인하세요.',0],
s12:['칼을 앞세워 달리는 기사 설이','생각을 곧장 행동으로 옮기는 빠른 돌파예요.','말과 행동이 너무 빨라 상처를 줘요.','할 말은 바로 하는 편이죠?','직진하는 사람이에요. 너무 몰아붙이진 마세요.','빠르게 밀어붙여 성과를 내요.','급한 결정은 손해예요.','직설이 오해를 부를 수 있어요.','보내기 전에 한 번 더 읽으세요.',1],
s13:['칼을 세워 든 여왕 설이','냉철하고 공정한 판단력이에요. 감정에 휘둘리지 않아요.','날카로운 말이 상처를 줘요.','남들보다 상황을 빨리 꿰뚫는 편이죠?','기준이 분명해요. 아닌 건 아니에요.','분석과 판단이 빛나요.','꼼꼼한 관리가 이득이에요.','솔직함이 믿음을 줘요.','부드러운 말로 정확히 말하세요.',1],
s14:['칼을 든 왕 설이','논리와 원칙으로 판단하는 권위의 기운이에요.','원칙이 고집이 되어 차갑게 느껴져요.','결국 공정하냐 아니냐가 중요하죠?','이성적인 사람이에요. 대화로 풀어요.','계약이나 전문 분야에서 강해요.','계획과 서류가 돈을 지켜요.','판단을 내려야 하는 자리에 서요.','사실과 기준으로 결정하세요.',1],
p1:['빛 속에 떠오른 금화를 올려다보는 설이','돈과 현실의 새 기회가 손에 들어와요.','기회를 놓치거나 계획이 허술해요.','요즘 "돈 좀 모아야지" 결심했죠?','현실적이고 믿음직한 인연이 시작돼요.','합격·계약·새 일자리 운이에요.','새 수입원이 생겨요.','실속 있는 인맥이에요.','작은 돈부터 따로 모으세요.',2],
p2:['금화 두 개로 저글링하는 설이','두 가지를 동시에 잘 굴리고 있어요.','균형을 잃고 일정이 꼬여요.','요즘 일과 생활 사이를 바쁘게 오가죠?','바빠도 시간을 내야 해요.','할 일이 겹쳐요. 순서를 정하세요.','수입과 지출의 균형을 맞추세요.','약속이 겹쳐요.','하나는 내려놓으세요.',0],
p3:['금화 셋을 세우고 뿌듯해하는 설이','실력이 인정받고 협업이 잘 돼요.','손발이 안 맞거나 대충 넘어가요.','꼼꼼하게 해 놓고도 몰라줘서 서운했던 일 있죠?','함께 뭔가를 만들어 가는 관계예요.','팀 프로젝트에서 인정받아요.','기술이 돈이 돼요.','함께 일하는 사람과 잘 맞아요.','해 놓은 일을 사람들에게 보여 주세요.',1],
p4:['금화 지붕 아래 꼭 안고 있는 설이','지키려는 마음이 강해요. 안정적이지만 꽉 쥐고 있어요.','너무 아끼거나, 반대로 새어 나가요.','쉽게 마음이나 지갑을 열지 않는 편이죠?','마음을 너무 꽁꽁 닫았어요.','지금은 현상 유지가 최선이에요.','저축은 좋지만 필요한 데는 쓰세요.','선을 긋는 편이에요.','작은 것 하나는 기분 좋게 나누세요.',0],
p5:['눈비 속에 금화를 든 설이','춥고 부족하다고 느끼는 때예요. 하지만 도움의 손이 가까이 있어요.','힘든 시기를 지나 회복돼요.','요즘 혼자 버틴다는 느낌이었죠?','외로움이 커요. 도움을 청하세요.','불안정하지만 지나가요.','지출 관리가 꼭 필요해요.','기댈 곳은 생각보다 가까워요.','도움을 청하는 건 약한 게 아니에요.',-1],
p6:['참새에게 금화를 나눠 주는 설이','주고받는 균형, 도움과 보답의 카드예요.','한쪽만 주는 관계예요. 조건을 확인하세요.','최근 누군가를 도왔거나 도움을 받았죠?','서로 챙겨 주는 관계예요.','지원이나 보너스가 와요.','받을 돈이 돌아와요.','베푼 만큼 돌아와요.','작은 친절을 먼저 베푸세요.',1],
p7:['자라나는 금화를 바라보는 설이','씨 뿌린 것이 자라는 중이에요. 기다림이 필요해요.','결과가 더뎌 조급해요. 방향을 점검하세요.','"이게 맞나" 하며 기다리는 일 있죠?','천천히 익어 가는 관계예요.','성과는 조금 더 걸려요.','길게 보면 이득이에요.','시간이 필요한 관계예요.','중간 점검만 하고 기다리세요.',0],
p8:['금화를 하나씩 새기는 설이','한 우물을 파는 성실함이 실력이 돼요.','지루한 반복에 지쳤어요.','요즘 묵묵히 하는 일이 하나 있죠?','꾸준한 정성이 마음을 얻어요.','기술과 공부에 집중하면 성장해요.','꾸준한 노력이 수입이 돼요.','믿음은 시간이 쌓아요.','오늘 30분만 집중해 보세요.',1],
p9:['금화 정원에서 여유로운 설이','혼자 힘으로 이룬 여유와 품격이에요.','겉은 여유로운데 속은 불안해요.','남한테 기대지 않고 해내는 편이죠?','혼자서도 빛나서 좋은 사람이 다가와요.','자립의 성과가 나요.','재정이 넉넉해져요.','격 있는 사람들과 어울려요.','나를 위한 작은 사치를 허락하세요.',2],
p10:['노을 아래 금화 짐을 지고 마을로 가는 설이','오래가는 풍요와 가족의 안정, 큰 흐름의 완성이에요.','집안 돈 문제를 조심하세요.','결국 "안정"이 제일 중요하죠?','오래가는 관계, 집안끼리 오가는 이야기예요.','탄탄한 곳에 자리 잡아요.','긴 안목의 재산이 늘어요.','가족과 친척 운이 좋아요.','길게 보는 계획을 세우세요.',2],
p11:['금화를 들여다보는 꼬마 설이','배우고 준비하는 성실한 시작이에요. 좋은 소식이 와요.','공부나 계획이 흐지부지돼요.','새로 공부하거나 자격증을 생각하고 있죠?','천천히 진지하게 다가와요.','합격과 취업 소식에 좋아요.','작은 돈이 쌓이기 시작해요.','배울 사람을 만나요.','계획표를 한 장 만드세요.',1],
p12:['금화를 들고 말 탄 기사 설이','느리지만 확실하게 가는 성실함이에요.','너무 느리거나 고집스러워요.','한 번 맡은 건 끝까지 하는 편이죠?','믿음직하지만 표현이 서툴러요.','꾸준함이 결국 이겨요.','안정적으로 늘어요.','약속을 잘 지키는 사람이에요.','느려도 멈추지 마세요.',1],
p13:['금화를 소중히 든 여왕 설이','살림과 현실 감각이 뛰어난 넉넉함이에요.','남 챙기다 나를 잊어요.','주변을 잘 챙기는 실속파죠?','편안하고 따뜻한 관계예요.','실무 능력을 인정받아요.','알뜰하게 불려요.','모두가 기대는 사람이에요.','나를 위한 지출도 계획에 넣으세요.',2],
p14:['금화를 쥔 왕 설이','돈과 성공을 다루는 큰손의 기운이에요.','돈에 집착하거나 무리하게 넓혀요.','결국 현실적인 결과가 제일 중요하죠?','든든하고 책임감 강한 사람이에요.','사업과 재정 운이 강해요.','큰돈이 움직여요. 계획대로 가세요.','영향력 있는 사람과 이어져요.','숫자로 확인하고 결정하세요.',2]};

function posText(pos,c,rev,cat){

function predict(cards,mode){
  // 예스 점수: 결과·미래 자리는 두 배. 역방향은 기운이 꺾임.
  let sum=0,w=0;cards.forEach((x,k)=>{const pos=mode.pos[k],wt=FUT.test(pos)?2:BLOCK.test(pos)?1.2:1,y=x.rev?-(Math.abs(x.c.yes)*.5)-.5:x.c.yes;sum+=y*wt;w+=wt});
  const v=sum/w,level=Math.max(1,Math.min(5,Math.round(3+v*1.2)));
  const verdict=level>=4?['🟢','예스 쪽이에요','카드들이 고개를 끄덕이고 있어요.']:level<=2?['🔴','지금은 노 쪽이에요','지금은 때가 아니라고 말해요. 하지만 흐름은 바뀔 수 있어요.']:['🟡','반반이에요','당신의 선택과 행동이 결과를 정해요.'];
  const key=[...cards].reverse().find((x,k)=>FUT.test(mode.pos[cards.length-1-k]))||cards[cards.length-1];
  return {level,verdict,timing:key.c.timing,label:['낮음','조금 낮음','보통','높음','아주 높음'][level-1]};
}

    const l=new THREE.PointLight('#ffb35c',.9,4.5,2);l.position.set(x,h+.25,z);sc.add(l);S.candles.push({f,l,ph:k*2})});
  // 금빛 먼지
  const N=260,pos=new Float32Array(N*3);for(let k=0;k<N;k++){pos[k*3]=(rng()-.5)*12;pos[k*3+1]=rng()*7-.5;pos[k*3+2]=(rng()-.5)*8-1}
  const pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(pos,3));
  S.dust=new THREE.Points(pg,new THREE.PointsMaterial({color:'#f5d995',size:.035,transparent:true,opacity:.7,depthWrite:false}));sc.add(S.dust);
  S.bursts=[];
  S.master=USE_PHOTO?buildPhotoMaster():buildMaster();sc.add(S.master.root);
  S.cardGeo=new THREE.PlaneGeometry(.62,1.0);
  S.ray=new THREE.Raycaster();S.ndc=new THREE.Vector2();S.look=new THREE.Vector2();
  initBloom();addEventListener('resize',resize);resize();
}
function resize(){const w=innerWidth,h=innerHeight;S.r.setSize(w,h,false);S.cam.aspect=w/h;
  const portrait=w/h<.8;S.cam.fov=portrait?52:40;S.camBase={p:new THREE.Vector3(0,portrait?6.4:5.2,portrait?6.6:6.2),t:new THREE.Vector3(0,portrait?.9:.8,-.4)};placeCam();S.cam.updateProjectionMatrix();S.portrait=portrait;
  if(S.comp){S.comp.setSize(w,h);S.bloom.resolution.set(w,h)}}
// 시작할 때 멀리서 상담소로 천천히 다가가는 카메라
S.intro=1;function placeCam(){const b=S.camBase;if(!b)return;const e=S.intro*S.intro*(3-2*S.intro);S.cam.position.set(b.p.x,b.p.y+e*2.2,b.p.z+e*5.5);S.cam.lookAt(b.t.x,b.t.y+e*1.4,b.t.z)}
function initBloom(){if(!THREE.EffectComposer||!THREE.UnrealBloomPass)return;try{const c=new THREE.EffectComposer(S.r);c.setPixelRatio(Math.min(1.5,devicePixelRatio||1));c.addPass(new THREE.RenderPass(S.sc,S.cam));
  S.bloom=new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),.6,.45,.8);c.addPass(S.bloom);S.comp=c}catch(e){S.comp=null}}

/* ============ 7. 설이 (교체 가능한 캐릭터 모듈) ============ */
// 나중에 고퀄 3D 모델(glTF)로 바꿀 때: 같은 모양의 {root, head, eyes, pawR, pawL, update(t)} 를 돌려주면 됨.
function buildMaster(){
  const M=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.75},o));
  const fur=M('#e2b57e'),fur2=M('#f3dcb6'),navy=M('#1f2c5e',{roughness:.85}),cream=M('#efe4cf',{roughness:.85}),black=M('#141012',{roughness:.3}),gold=M('#e2b866',{metalness:.8,roughness:.3});
  const root=new THREE.Group();root.position.set(0,0,-2.1);
  const add=(geo,mat,x,y,z,p=root)=>{const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.castShadow=true;p.add(m);return m};
  // 한복 몸통(남색 두루마기) + 미색 소매·깃
  const body=add(new THREE.CylinderGeometry(.55,1.0,1.7,32),navy,0,.55,0);
  add(new THREE.TorusGeometry(.5,.05,10,40,Math.PI),cream,0,1.32,.08).rotation.set(-.35,0,Math.PI);
  const collar=add(new THREE.BoxGeometry(.12,.75,.04),cream,-.08,1.0,.5);collar.rotation.set(-.3,0,-.55);
  const collar2=add(new THREE.BoxGeometry(.12,.75,.04),cream,.1,1.0,.5);collar2.rotation.set(-.3,0,.55);
  const belt=add(new THREE.TorusGeometry(.66,.045,10,48),M('#b9b3aa'),0,.62,0);belt.rotation.x=Math.PI/2;
  [[.05,.5],[.05,.38]].forEach(([x,y],k)=>add(new THREE.SphereGeometry(.055,14,10),M(k?'#8fc7b3':'#6fae9c',{roughness:.2}),x,y,.68));
  const tassel=add(new THREE.ConeGeometry(.08,.34,12),M('#2f55b5'),.05,.14,.68);
  // 팔(소매)과 앞발 — 탁자 위에 올림
  const arm=(sx)=>{const g=new THREE.Group();g.position.set(sx*.62,1.02,.15);root.add(g);
    const sl=add(new THREE.CylinderGeometry(.17,.26,.95,20),cream,0,-.42,0,g);sl.rotation.x=.0;
    const cuff=add(new THREE.TorusGeometry(.24,.04,8,24),navy,0,-.88,0,g);cuff.rotation.x=Math.PI/2;
    const pw=add(new THREE.SphereGeometry(.17,20,16),fur2,0,-.98,.05,g);pw.scale.set(1,.7,1.3);
    g.rotation.x=-1.05;g.rotation.z=sx*.12;return g};
  const pawL=arm(-1),pawR=arm(1);
  // 꼬리
  const tail=add(new THREE.SphereGeometry(.22,16,12),fur,.95,.15,-.35);tail.scale.set(1.8,.7,.8);tail.rotation.z=.4;
  // 머리
  const head=new THREE.Group();head.position.set(0,1.95,.05);root.add(head);
  const skull=add(new THREE.SphereGeometry(.56,40,30),fur,0,0,0,head);skull.scale.set(1,.95,.95);
  add(new THREE.SphereGeometry(.42,30,24),fur2,0,-.2,.22,head).scale.set(1.05,.8,.8);
  const muz=add(new THREE.SphereGeometry(.24,30,24),fur2,0,-.2,.47,head);muz.scale.set(1.1,.78,1);
  add(new THREE.SphereGeometry(.09,20,16),black,0,-.12,.7,head).scale.set(1.25,.85,.9);
  const mouth=add(new THREE.TorusGeometry(.06,.012,6,16,Math.PI),black,0,-.3,.66,head);mouth.rotation.z=Math.PI;
  const eyes=[-1,1].map(s=>{const e=add(new THREE.SphereGeometry(.085,20,16),black,s*.2,.06,.47,head);
    add(new THREE.SphereGeometry(.022,8,8),M('#ffffff',{emissive:'#ffffff',emissiveIntensity:.6}),s*.2+.03,.1,.55,head);return e});
  // 반쯤 접힌 귀 — 위로 서다 끝이 앞으로 접힘
  const ear=(s)=>{const g=new THREE.Group();g.position.set(s*.36,.42,-.02);g.rotation.z=-s*.35;head.add(g);
    const base=add(new THREE.ConeGeometry(.2,.36,4),fur,0,.14,0,g);base.scale.set(1,1,.35);
    const tip=new THREE.Group();tip.position.set(0,.3,0);g.add(tip);const t=add(new THREE.ConeGeometry(.17,.28,4),M('#d29d63'),0,.12,0,tip);t.scale.set(1,1,.32);tip.rotation.x=1.25;
    return g};
  const ears=[ear(-1),ear(1)];
  // 도사 모자(검은 갓 느낌, 금 끈)
  const hat=new THREE.Group();hat.position.set(0,.5,0);head.add(hat);
  add(new THREE.CylinderGeometry(.78,.78,.03,48),M('#0f0f14',{roughness:.5,transparent:true,opacity:.92}),0,0,0,hat);
  add(new THREE.CylinderGeometry(.26,.3,.42,32),M('#0f0f14',{roughness:.5,transparent:true,opacity:.92}),0,.22,0,hat);
  add(new THREE.TorusGeometry(.3,.02,8,32),gold,0,.03,0,hat).rotation.x=Math.PI/2;
  hat.rotation.x=-.08;
  const st={blink:2,gest:0,shuffle:0,tilt:0,talk:0};
  function update(t,dt){
    // 시선: 포인터 쪽을 부드럽게 바라봄
    head.rotation.y+=((S.look.x*.35)-head.rotation.y)*.06;head.rotation.x+=((-S.look.y*.15+.05)-head.rotation.x)*.06;
    head.rotation.z+=((Math.sin(t*.7)*.04+st.tilt)-head.rotation.z)*.05;
    st.blink-=dt;const b=st.blink<.12?.1:1;eyes.forEach(e=>e.scale.y=b);if(st.blink<0)st.blink=2+rng()*3;
    ears.forEach((e,k)=>{e.rotation.x=Math.sin(t*1.3+k)*.04+(st.talk>0?Math.sin(t*12)*.06:0)});
    root.position.y=Math.sin(t*1.6)*.02;
    tail.rotation.y=Math.sin(t*(st.talk>0?9:3))*.35;
    if(st.talk>0){st.talk-=dt;mouth.scale.y=1+Math.abs(Math.sin(t*14))*.8}else mouth.scale.y=1;
    // 셔플: 두 앞발이 번갈아 움직임 / 손짓: 오른발 들어 카드 쪽 가리킴
    if(st.shuffle>0){st.shuffle-=dt;pawL.rotation.x=-1.05+Math.sin(t*16)*.18;pawR.rotation.x=-1.05+Math.sin(t*16+Math.PI)*.18}
    else if(st.gest>0){st.gest-=dt;const k=Math.sin(Math.min(1,st.gest)*Math.PI);pawR.rotation.x=-1.05-k*.6;pawR.rotation.z=.12-k*.3;pawL.rotation.x+=(-1.05-pawL.rotation.x)*.1}
    else{pawR.rotation.x+=(-1.05-pawR.rotation.x)*.1;pawL.rotation.x+=(-1.05-pawL.rotation.x)*.1;pawR.rotation.z+=(.12-pawR.rotation.z)*.1}
  }
  return {root,head,eyes,pawL,pawR,st,update};
}

function buildPhotoMaster(){
  const L=new THREE.TextureLoader(),tb=L.load(SEOL_BODY),th=L.load(SEOL_HEAD);tb.encoding=th.encoding=THREE.sRGBEncoding;
  const Hh=2.75,Ww=Hh*586/720,hc=.40,tint='#f3e9da';
  const root=new THREE.Group();root.position.set(0,-.04,-3.2);
  const halo=new THREE.Mesh(new THREE.CircleGeometry(1.25,48),new THREE.MeshBasicMaterial({color:'#e2b866',transparent:true,opacity:.14,depthWrite:false}));halo.position.set(0,Hh*.82,-.05);root.add(halo);
  const bodyM=new THREE.Mesh(new THREE.PlaneGeometry(Ww,Hh),new THREE.MeshBasicMaterial({map:tb,transparent:true,alphaTest:.03,color:tint}));bodyM.position.y=Hh/2;root.add(bodyM);
  const pivot=new THREE.Group();pivot.position.set(0,Hh*(1-hc),.01);root.add(pivot);
  const headM=new THREE.Mesh(new THREE.PlaneGeometry(Ww,Hh*hc),new THREE.MeshBasicMaterial({map:th,transparent:true,alphaTest:.03,color:tint}));headM.position.y=Hh*hc/2;pivot.add(headM);
  const faces={base:th};Object.entries(SEOL_FACE).forEach(([k,u])=>{const tx=L.load(u);tx.encoding=THREE.sRGBEncoding;faces[k]=tx});
  const st={blink:2.5,gest:0,shuffle:0,tilt:0,talk:0,smile:0};let cur='base';
  const face=k=>{if(cur!==k&&faces[k]){headM.material.map=faces[k];headM.material.needsUpdate=true;cur=k}};
  function update(t,dt){
    // 표정: 눈 깜빡임(3~5초마다) · 말할 때 입 움직임 · 결과 때 웃음
    st.blink-=dt;if(st.blink<-.13)st.blink=2.8+rng()*2.5;if(st.smile>0)st.smile-=dt;
    face(st.blink<0?'blink':st.smile>0?'smile':st.talk>0&&Math.sin(t*14)>0?'talk':'base');
    const br=1+Math.sin(t*1.6)*.006;bodyM.scale.y=br;bodyM.position.y=Hh*br/2;pivot.position.y=Hh*(1-hc)*br;
    let rz=Math.sin(t*.7)*.025-S.look.x*.05+st.tilt,bob=0;
    if(st.talk>0){st.talk-=dt;bob=Math.abs(Math.sin(t*9))*.025;rz+=Math.sin(t*4.5)*.02}
    if(st.gest>0){st.gest-=dt;rz+=Math.sin(Math.min(1,st.gest)*Math.PI)*.12}
    if(st.shuffle>0){st.shuffle-=dt;root.position.x=Math.sin(t*18)*.02;rz+=Math.sin(t*9)*.03}else root.position.x*=.9;
    pivot.rotation.z+=(rz-pivot.rotation.z)*.12;pivot.position.y+=bob;
    halo.material.opacity=.12+Math.sin(t*1.2)*.04;
  }
  return {root,st,update};
}

const tweens=[];
const ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
function tween(o,to,dur,delay=0,done){tweens.push({o,from:null,to,dur,delay,t:0,done})}
function runTweens(dt){for(let k=tweens.length-1;k>=0;k--){const w=tweens[k];if(w.delay>0){w.delay-=dt;continue}
  if(!w.from){w.from={px:w.o.position.x,py:w.o.position.y,pz:w.o.position.z,rx:w.o.rotation.x,ry:w.o.rotation.y,rz:w.o.rotation.z,s:w.o.scale.x}}
  w.t+=dt;const p=ease(Math.min(1,w.t/w.dur)),f=w.from,to=w.to,L=(a,b)=>b===undefined?a:a+(b-a)*p;
  w.o.position.set(L(f.px,to.px),L(f.py,to.py),L(f.pz,to.pz));w.o.rotation.set(L(f.rx,to.rx),L(f.ry,to.ry),L(f.rz,to.rz));if(to.s!==undefined)w.o.scale.setScalar(L(f.s,to.s));
  if(w.t>=w.dur){tweens.splice(k,1);w.done&&w.done()}}}

말투: 오래된 용한 타로집 선생님처럼. 첫 문장은 손님 마음을 콕 집는 한마디("요즘 ~하지 않았나요?")로 시작하고, 카드 그림 속 장면을 짚어 가며 이야기한다.
형식(한국어, 존댓말, 650자 안팎, 마크다운 기호 없이 문단만):

}
function wrapText(g,text,x,y,maxW,lh,maxLines){const lines=[];let line='';for(const ch of String(text)){if(g.measureText(line+ch).width>maxW&&line){lines.push(line);line=ch}else line+=ch}if(line)lines.push(line);
  const out=lines.slice(0,maxLines);if(lines.length>maxLines)out[maxLines-1]=out[maxLines-1].slice(0,-1)+'…';out.forEach(l=>{g.fillText(l,x,y);y+=lh});return y}

  if(R.match)block('💑 궁합',`${R.match.score}점 · ${R.match.pair}`,1);if(R.year)block('🎍 2027 가장 빛나는 달',`${R.year.best.m}월 ${R.year.best.c.name} · 조심할 달 ${R.year.worst.m}월`,1);block('전체 운세',R.summary,5);if(R.pred)block('🔮 설이의 예감',`${R.pred.verdict[1]} · 가능성 ${R.pred.label} · ${R.pred.timing}`,2);block('카드의 조합',R.combo,3);block('설이의 조언',R.advice,2);

function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function stamps(){try{return JSON.parse(localStorage.getItem('seoltarot_days')||'[]')}catch(e){return[]}}
function streakOf(ds){let n=0;const d=new Date();for(;;){const k=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;if(!ds.includes(k))break;n++;d.setDate(d.getDate()-1)}return n}
function paintStreak(){const n=streakOf(stamps());$('#streak').textContent=n?`· 출석 ${n}일째`:''}
function dailyIdx(){let id=null;try{id=localStorage.getItem('seoltarot_uid');if(!id){id=String(Math.floor(rng()*1e9));localStorage.setItem('seoltarot_uid',id)}}catch(e){id='0'}
  let h=2166136261;for(const ch of today()+id){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return (h>>>0)%78}
function startDaily(){ST.daily=true;ST.mode=MODES[0];ST.cat='today';$('#qin').value='';const ds=stamps();if(!ds.includes(today())){ds.push(today());try{localStorage.setItem('seoltarot_days',JSON.stringify(ds.slice(-60)))}catch(e){}}
  ST.streak=streakOf(ds);deal()}

function loop(now){const raw=(now-last)/1000,dt=Math.min(.05,raw);last=now;T+=dt;if(!LIGHT&&T>2){fpsT+=raw;fpsN++;if(fpsT>3){if(fpsN/fpsT<26)lightMode();fpsT=0;fpsN=0}}
  runTweens(dt);S.master.update(T,dt);
  S.candles.forEach(c=>{const f=1+Math.sin(T*9+c.ph)*.08+Math.sin(T*23+c.ph)*.05;c.l.intensity=.9*f;c.f.scale.set(f,1.8*f,f)});
  S.smoke.forEach(sp=>{sp.userData.t+=dt;const u=(sp.userData.t%6)/6;sp.position.set(S.burner.x+Math.sin(u*9+sp.id)*.12*u,S.burner.y+.1+u*2.2,S.burner.z+Math.cos(u*7)*.08*u);sp.scale.setScalar(.15+u*.6);sp.material.opacity=Math.sin(u*Math.PI)*.35});
  S.ballLight.intensity=.5+Math.sin(T*1.5)*.2;S.ball.rotation.y+=dt*.2;S.circ.rotation.z+=dt*.03;
  S.dust.rotation.y+=dt*.01;S.dust.position.y=Math.sin(T*.3)*.1;
  for(let k=S.bursts.length-1;k>=0;k--){const b=S.bursts[k];b.life-=dt;const a=b.pts.geometry.attributes.position;
    for(let j=0;j<b.vel.length;j++){b.vel[j].y-=dt*(b.grav??2.5);a.array[j*3]+=b.vel[j].x*dt;a.array[j*3+1]+=b.vel[j].y*dt;a.array[j*3+2]+=b.vel[j].z*dt}
    a.needsUpdate=true;b.pts.material.opacity=Math.max(0,b.life);if(b.life<=0){S.sc.remove(b.pts);S.bursts.splice(k,1)}}
  // 선택 대기 카드: 살짝 떠오르는 숨쉬기
  if(ST.phase==='pick')ST.spread.forEach((c,k)=>{if(!c.picked&&!tweens.some(w=>w.o===c.g)){c.ly=(c.ly||0)+((c.lift||0)-(c.ly||0))*.25;if(c.base===undefined)c.base=c.g.position.z;
    c.g.position.y=.04+k*.002+Math.max(0,Math.sin(T*2+k*.5))*.03+c.ly*.35;c.g.position.z=c.base+c.ly*.3;c.g.rotation.x=-Math.PI/2+c.ly*.55}});
  if(sayT>0){sayT-=dt;if(sayT<=0)$('#say').classList.remove('on')}
  if(S.introGo&&S.intro>0){S.intro=Math.max(0,S.intro-dt/2.6);placeCam()}
  if(S.comp){try{S.comp.render()}catch(e){S.comp=null;S.r.render(S.sc,S.cam)}}else S.r.render(S.sc,S.cam);requestAnimationFrame(loop)}
function boot(){
  if(!window.THREE){$('#loading').textContent='3D를 불러오지 못했어요. 새로고침해 주세요.';return}
  try{initScene()}catch(e){$('#loading').textContent='이 기기에서는 3D를 켤 수 없어요.';return}
  $('#loading').remove();$('#start').hidden=false;paintStreak();requestAnimationFrame(loop);setTimeout(()=>say('멍. 설이네 타로에 오신 걸 환영해요.'),600)}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(boot,boot);else boot();
}
</script>
