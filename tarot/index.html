<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>설이네 타로</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
/* VOICE: 조용하고 신비로운 한옥 점집. 설이는 점잖은 척하는 강아지 도사.
   IDEA: 밤의 상담소 — 남색 비단 탁자, 촛불, 수정구, 금빛 마법진, 한복 입은 설이.
   PICTURE: 전체 화면 3D 상담소. 설이가 카드를 섞고, 사용자가 직접 고른다.
   COLOUR and TYPE: 깊은 남색·검정 + 금속 금빛 + 한복 미색. 제목 Gowun Batang, 본문 Gowun Dodum.
   LAYOUT: 3D 장면이 바탕, 위 안내 한 줄, 아래 시트(선택·결과). 세로 9:16 우선. */
:root{color-scheme:dark;--ink:#f3ecdc;--soft:#b8b2c8;--gold:#e2b866;--gold2:#f5d995;--navy:#141a33;--panel:rgba(16,18,38,.9);--line:rgba(226,184,102,.35);--cream:#f4ecdb}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:#07080f;color:var(--ink);font:16px/1.6 "Gowun Dodum",system-ui,sans-serif;overflow:hidden}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.serif{font-family:"Gowun Batang",serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;border-radius:14px;min-height:44px}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.gold{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#2a1f08;font-weight:700}
.line{background:rgba(255,255,255,.04);border:1px solid var(--line)}
/* 시작 화면 */
#start{position:fixed;inset:0;display:grid;place-items:end center;padding:0 20px calc(40px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(7,8,15,0) 40%,rgba(7,8,15,.85) 75%)}
#start[hidden]{display:none}
#start .box{text-align:center;max-width:420px}
#start .en{letter-spacing:.3em;color:var(--gold);font-size:13px;margin:0}
#start h1{font-size:48px;line-height:1.05;margin:6px 0 8px;color:var(--cream);text-shadow:0 0 24px rgba(226,184,102,.45)}
#start p{color:var(--soft);margin:0 0 20px}
#start .gold{width:100%;font-size:19px;min-height:56px}
/* 위 안내 */
#hint{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);max-width:92vw;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:15px;text-align:center;display:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#say{position:fixed;left:50%;transform:translateX(-50%);top:calc(58px + env(safe-area-inset-top));max-width:min(86vw,420px);background:var(--cream);color:#2a2238;border-radius:16px;padding:8px 14px;font-size:15px;text-align:center;opacity:0;transition:opacity .35s;pointer-events:none}
#say.on{opacity:1}
/* 아래 시트 */
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:78vh;overflow:auto;background:var(--panel);backdrop-filter:blur(10px);border-top:1px solid var(--line);border-radius:22px 22px 0 0;padding:16px max(4vw,16px) calc(18px + env(safe-area-inset-bottom));display:none}
.sheet.on{display:block;animation:up .45s ease-out}
.wrap{max-width:560px;margin:0 auto}
.sheet h2{font-family:"Gowun Batang",serif;font-size:22px;margin:4px 0 10px;color:var(--cream)}
.lab{font-size:14px;color:var(--soft);margin:12px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:rgba(255,255,255,.04);border:1px solid var(--line);padding:0 13px;font-size:15px}
.chip[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:#2a1f08}
.chip small{display:block;font-size:12px;opacity:.75;line-height:1.2}
.mode{padding:6px 12px;text-align:left}
input[type=text]{width:100%;font:inherit;font-size:16px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--ink);min-height:44px}
.go{width:100%;margin-top:16px;font-size:18px;min-height:52px}
#pickbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));display:none;gap:8px}
#pickbar button{padding:0 18px}
/* 결과 */
.sum{background:rgba(226,184,102,.1);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:12px}
.q{color:var(--soft);font-size:14px;margin:0 0 4px}
.item{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;padding:12px 0;border-top:1px solid rgba(255,255,255,.08)}
.thumb{width:64px;height:100px;border-radius:8px;object-fit:cover;border:1px solid var(--line)}
.thumb.rev{transform:rotate(180deg)}
.pos{font-size:13px;color:var(--gold)}
.nm{font-family:"Gowun Batang",serif;font-size:18px;font-weight:700}
.dir{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:2px;font-family:"Gowun Dodum"}
.kw{font-size:13px;color:var(--soft)}
.item p,.blk p{margin:4px 0 0}
.blk{padding:10px 0;border-top:1px solid rgba(255,255,255,.08)}
.blk b{color:var(--gold2);font-weight:400;font-family:"Gowun Batang",serif}
.last{background:var(--cream);color:#2a2238;border-radius:16px;padding:12px 14px;margin-top:10px}
.row{display:flex;gap:8px;margin-top:14px}.row button{flex:1}
.hist{padding:10px 0;border-top:1px solid rgba(255,255,255,.08);width:100%;text-align:left;background:none;border-radius:0}
.fine{font-size:13px;color:var(--soft);margin:12px 0 0}
#topbtn{position:fixed;right:12px;top:calc(10px + env(safe-area-inset-top));display:none;background:var(--panel);border:1px solid var(--line);padding:0 12px;font-size:14px}
#loading{position:fixed;inset:0;display:grid;place-items:center;color:var(--soft);font-size:15px}
#result{max-height:60vh;transition:max-height .35s}#result.min{max-height:96px;overflow:hidden}
.peek{float:right;background:rgba(255,255,255,.06);border:1px solid var(--line);font-size:14px;padding:0 12px;min-height:40px}
#snd{position:fixed;left:12px;top:calc(10px + env(safe-area-inset-top));display:none;background:var(--panel);border:1px solid var(--line);padding:0 12px;font-size:14px}
.ai{margin-top:12px;border:1px solid var(--line);border-radius:16px;padding:12px 14px;background:rgba(255,255,255,.03)}
.ai p{white-space:pre-wrap;margin:6px 0 0}
.ai .wait{color:var(--soft);font-size:14px}
.row.wrap2{flex-wrap:wrap}.row.wrap2 button{flex:1 1 40%}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.sheet.on{animation:none}#say{transition:none}}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="loading">상담소 불을 켜는 중…</div>
<div id="hint"></div>
<div id="say"></div>
<button id="topbtn">상담 기록</button>
<button id="snd" aria-pressed="true">소리 켬</button>
<section id="start" hidden>
  <div class="box">
    <p class="en">DOG TAROT</p>
    <h1 class="serif">설이네 타로</h1>
    <p>당신의 운명의 발자국을 따라가 보세요.</p>
    <button class="gold" id="startBtn">시작하기</button>
  </div>
</section>
<section class="sheet" id="setup"><div class="wrap">
  <h2>무엇이 궁금하신가요?</h2>
  <div class="lab">타로 방식</div><div class="chips" id="modes"></div>
  <div class="lab">상담 주제</div><div class="chips" id="cats"></div>
  <div class="lab">직접 질문 (선택)</div><input type="text" id="qin" maxlength="60" placeholder="예: 이번 달에 이직해도 될까요?">
  <button class="gold go" id="shuffleBtn">설이에게 카드 섞어 달라고 하기</button>
</div></section>
<div id="pickbar"><button class="gold" id="readBtn">해석 보기</button></div>
<section class="sheet" id="result"><div class="wrap" id="resultIn"></div></section>
<section class="sheet" id="history"><div class="wrap" id="histIn"></div></section>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
{
/* ============ 1. 카드 데이터 (78장) ============ */
// 메이저: [기호, 이름, 키워드, 정방향, 역방향, 연애, 금전, 직장, 인간관계, 긍정, 주의, 조언]
const MAJ=[
['☆','바보','시작 · 자유 · 모험','가벼운 마음으로 새 길에 들어서는 때예요.','준비 없이 뛰어들어 발이 꼬일 수 있어요.','부담 없는 새 만남이 설렘을 줘요.','새 기회가 보이지만 충동 지출은 조심해요.','새로운 도전이나 낯선 업무가 길을 열어요.','처음 보는 사람과 의외로 잘 통해요.','두려움보다 호기심이 앞서요.','발밑을 살피지 않으면 넘어져요.','작게, 지금 바로 시작해 보세요.'],
['✦','마법사','재능 · 실행 · 의지','가진 재주로 원하는 걸 만들어 낼 수 있어요.','말만 앞서고 손이 안 따라갈 수 있어요.','먼저 표현하는 쪽이 흐름을 쥐어요.','능력을 돈으로 바꿀 기회가 와요.','기획한 일을 실제로 옮길 때예요.','당신의 말솜씨가 사람을 모아요.','필요한 도구는 이미 손에 있어요.','과장된 약속은 신뢰를 깎아요.','미뤄 둔 한 가지를 오늘 실행하세요.'],
['☾','여사제','직감 · 비밀 · 고요','말보다 느낌이 정답에 가까운 때예요.','감을 무시하거나 숨긴 마음이 엉켜요.','상대는 마음을 쉽게 드러내지 않아요. 조용히 지켜보세요.','서두르지 말고 정보를 더 모으세요.','드러나지 않은 사정이 있어요. 관찰이 먼저예요.','비밀을 지켜 주는 사람이 신뢰를 얻어요.','당신의 직감은 꽤 정확해요.','혼자 짐작만 키우면 오해가 생겨요.','결정 전에 하루만 조용히 생각해 보세요.'],
['❀','여황제','풍요 · 돌봄 · 매력','넉넉함과 따뜻함이 흘러드는 때예요.','지나친 돌봄이 나를 지치게 해요.','다정함이 가장 큰 매력이 돼요.','수입과 여유가 늘어나는 흐름이에요.','공들여 키운 일이 열매를 맺어요.','사람들이 당신 곁에서 편안해해요.','작은 기쁨이 계속 들어와요.','남 챙기다 나를 잊지 마세요.','오늘은 나에게도 맛있는 걸 선물하세요.'],
['♜','황제','질서 · 책임 · 안정','틀을 세우면 일이 단단해지는 때예요.','고집과 통제가 관계를 딱딱하게 해요.','확실한 태도가 마음을 움직여요.','계획적인 관리가 돈을 지켜요.','리더십을 발휘할 자리가 생겨요.','기준이 분명한 사람이 존중받아요.','정리하면 운이 열려요.','내 방식만 고집하면 사람이 떠나요.','할 일 목록부터 정리해 보세요.'],
['✚','교황','조언 · 전통 · 배움','믿을 만한 가르침이 길을 비춰요.','형식에만 매여 본질을 놓쳐요.','주변 소개나 오래된 인연이 이어져요.','검증된 방법이 안전해요.','선배나 멘토의 조언이 도움이 돼요.','함께 지키는 약속이 관계를 묶어 줘요.','물어보면 답이 쉽게 나와요.','남의 기준에 나를 다 맞추진 마세요.','믿을 만한 사람에게 한 번 물어보세요.'],
['♡','연인','선택 · 사랑 · 조화','마음이 뛰는 쪽을 고르는 때예요.','망설임이나 엇갈린 마음이 생겨요.','설레는 기운이 가득해요. 마음을 표현해도 좋아요.','두 갈래 중 가치에 맞는 쪽을 고르세요.','함께 일할 좋은 짝이 생겨요.','마음이 맞는 사람과 깊어져요.','진심이 통하는 때예요.','양쪽을 다 잡으려다 둘 다 놓쳐요.','머리보다 마음이 가리키는 쪽을 보세요.'],
['➶','전차','전진 · 의지 · 승리','밀어붙이면 앞으로 나아가는 때예요.','방향 없이 속도만 내다 부딪혀요.','망설이던 마음, 표현하면 통해요.','목표를 정하면 돈이 모여요.','추진력으로 성과를 내요.','앞장서면 사람들이 따라와요.','목표가 보이면 멈추지 마세요.','브레이크 없는 질주는 위험해요.','오늘 할 일 하나를 끝까지 밀고 가세요.'],
['♌','힘','인내 · 용기 · 부드러움','부드럽게 버티는 사람이 이기는 때예요.','참던 감정이 터지거나 자신감이 꺾여요.','천천히 다가가야 마음이 열려요.','조급함을 누르면 손실을 피해요.','어려운 일도 꾸준히 하면 풀려요.','화내지 않는 사람이 결국 이겨요.','당신 안에 생각보다 큰 힘이 있어요.','억지로 누르면 반발이 와요.','큰 소리 대신 꾸준함으로 가세요.'],
['✧','은둔자','성찰 · 쉼 · 지혜','혼자만의 시간이 답을 주는 때예요.','고립되거나 지나치게 움츠러들어요.','지금은 나를 먼저 돌볼 때예요.','큰 지출보다 점검이 먼저예요.','깊이 파고드는 일이 잘 맞아요.','소수의 깊은 관계가 힘이 돼요.','조용한 곳에서 답이 떠올라요.','너무 오래 숨어 있으면 기회가 지나가요.','오늘은 일찍 쉬고 생각을 정리하세요.'],
['⟳','운명의 수레바퀴','변화 · 흐름 · 기회','흐름이 바뀌고 새 기회가 도는 때예요.','타이밍이 어긋나거나 같은 일이 반복돼요.','갑작스러운 연락이나 만남이 와요.','운의 흐름이 바뀌어요. 기회를 잡으세요.','변화가 성장의 계기가 돼요.','돌고 돌아 다시 만나는 인연이 있어요.','나쁜 일은 지나가고 좋은 일이 와요.','운에만 맡기면 기회가 흘러가요.','들어오는 기회에 "네"라고 해 보세요.'],
['⚖','정의','공정 · 균형 · 결정','공평한 판단이 일을 바르게 푸는 때예요.','불공평함이나 미룬 결정이 짐이 돼요.','주는 만큼 받는 관계가 건강해요.','계약과 서류를 꼼꼼히 보세요.','원칙대로 하면 인정받아요.','솔직하고 공정한 태도가 믿음을 줘요.','뿌린 대로 거둬요.','한쪽 말만 듣고 판단하지 마세요.','사실을 확인하고 결정하세요.'],
['☊','매달린 사람','기다림 · 관점 · 멈춤','억지로 움직이기보다 기다릴 때예요.','기다림이 길어져 지치거나 희생만 해요.','답이 늦어도 조급해하지 마세요.','지금은 투자보다 관망이 나아요.','시각을 바꾸면 막힌 일이 풀려요.','상대 입장에서 보면 이해가 돼요.','멈춘 시간에도 무언가 자라요.','끝없는 희생은 답이 아니에요.','오늘은 다른 각도에서 바라보세요.'],

function rng(){const a=new Uint32Array(1);(crypto&&crypto.getRandomValues)?crypto.getRandomValues(a):(a[0]=Math.random()*4294967296);return a[0]/4294967296}
function shuffleDeck(){const d=DECK.map((c,i)=>({i,rev:rng()<0.35}));for(let k=d.length-1;k>0;k--){const j=Math.floor(rng()*(k+1));[d[k],d[j]]=[d[j],d[k]]}return d}

/* ============ 4. 해석 (카드 데이터 기반 · 추첨 결과에서 벗어나지 않음) ============ */
const pickOne=a=>a[Math.floor(rng()*a.length)];
const field=(c,cat,rev)=>{const f=CATS.find(x=>x[0]===cat)[2];const base=f==='gen'?(rev?c.rev:c.up):c[f];return rev&&f!=='gen'?`${base} 다만 역방향이라 이런 면도 살펴보세요: ${c.rev}`:base};
function interpret(st){
  const cards=st.picks.map(p=>({c:DECK[p.i],rev:p.rev}));
  const cat=CATS.find(x=>x[0]===st.cat);
  const maj=cards.filter(x=>x.c.arc==='major').length,revN=cards.filter(x=>x.rev).length;
  const suitN={};cards.forEach(x=>{if(x.c.suit)suitN[x.c.suit.n]=(suitN[x.c.suit.n]||0)+1});
  const topSuit=Object.entries(suitN).sort((a,b)=>b[1]-a[1])[0];
  const items=cards.map((x,k)=>({pos:st.mode.pos[k],name:x.c.name,rev:x.rev,kw:x.c.kw,text:field(x.c,st.cat,x.rev),card:x.c}));
  const combo=[];
  if(maj>=Math.ceil(cards.length/2))combo.push('메이저 카드가 많이 나왔어요. 작은 일이 아니라 인생의 큰 흐름과 이어진 질문이에요.');
  if(topSuit&&topSuit[1]>=2)combo.push(`${topSuit[0]} 카드가 ${topSuit[1]}장 모였어요. 이번 고민의 중심은 「${SUITS.find(s=>s.n===topSuit[0]).area}」이에요.`);
  if(revN>=Math.ceil(cards.length/2)&&cards.length>1)combo.push('역방향이 많아요. 막힌 곳을 정비하고 속도를 늦추라는 신호예요.');
  if(!combo.length)combo.push(cards.length===1?`「${cards[0].c.kw}」의 기운이 오늘 당신 곁에 있어요.`:'카드들이 고르게 섞여 있어요. 한쪽으로 치우치지 않은, 균형 잡힌 흐름이에요.');
  const lastC=cards[cards.length-1];
  const flow=cards.length===1?(lastC.rev?'지금은 잠깐 숨 고르기가 필요한 흐름이에요.':'오늘은 이 카드의 기운을 따라가면 좋아요.'):
    (lastC.rev?`마지막 「${st.mode.pos[cards.length-1]}」 자리의 ${lastC.c.name} 카드가 역방향이에요. 결과는 아직 정해지지 않았고, 지금의 선택으로 바꿀 수 있어요.`:`마지막 「${st.mode.pos[cards.length-1]}」 자리에 ${lastC.c.name} 카드가 바로 섰어요. ${lastC.c.pos}`);
  const opener=pickOne(['음… 발자국이 선명하게 보여요.','킁킁, 카드에서 좋은 냄새가 나요.','꼬리가 먼저 반응하는 카드들이네요.']);
  const jo=(cat[1].charCodeAt(cat[1].length-1)-44032)%28?'을':'를';const summary=`${opener} ${cat[1]}${jo} 보면, ${cards.map(x=>x.c.name+(x.rev?'(역)':'')).join(', ')} 카드가 나왔어요. ${field(cards[0].c,st.cat,cards[0].rev)}`;
  const caution=[...new Set(cards.filter(x=>x.rev).map(x=>x.c.caution).concat(cards.slice(0,1).map(x=>x.c.caution)))].slice(0,2).join(' ');
  const advice=(cards.find(x=>st.mode.pos[cards.indexOf(x)]==='조언')||lastC).c.advice;
  const lastWord=pickOne(['설이가 꼬리 흔들며 응원할게요.','멍! 오늘도 잘 해낼 거예요.','간식처럼 좋은 일이 곧 굴러올 거예요.','발자국은 당신이 만드는 거예요. 멍.']);
  return {items,summary,combo:combo.join(' '),flow,caution,advice,lastWord};
}

/* ============ 7. 설이 (교체 가능한 캐릭터 모듈) ============ */
// 나중에 고퀄 3D 모델(glTF)로 바꿀 때: 같은 모양의 {root, head, eyes, pawR, pawL, update(t)} 를 돌려주면 됨.
function buildMaster(){
  const M=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.75},o));
  const fur=M('#e2b57e'),fur2=M('#f3dcb6'),navy=M('#1f2c5e',{roughness:.85}),cream=M('#efe4cf',{roughness:.85}),black=M('#141012',{roughness:.3}),gold=M('#e2b866',{metalness:.8,roughness:.3});
  const root=new THREE.Group();root.position.set(0,0,-2.1);
  const add=(geo,mat,x,y,z,p=root)=>{const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.castShadow=true;p.add(m);return m};
  // 한복 몸통(남색 두루마기) + 미색 소매·깃
  const body=add(new THREE.CylinderGeometry(.55,1.0,1.7,32),navy,0,.55,0);
  add(new THREE.TorusGeometry(.5,.05,10,40,Math.PI),cream,0,1.32,.08).rotation.set(-.35,0,Math.PI);
  const collar=add(new THREE.BoxGeometry(.12,.75,.04),cream,-.08,1.0,.5);collar.rotation.set(-.3,0,-.55);
  const collar2=add(new THREE.BoxGeometry(.12,.75,.04),cream,.1,1.0,.5);collar2.rotation.set(-.3,0,.55);
  const belt=add(new THREE.TorusGeometry(.66,.045,10,48),M('#b9b3aa'),0,.62,0);belt.rotation.x=Math.PI/2;
  [[.05,.5],[.05,.38]].forEach(([x,y],k)=>add(new THREE.SphereGeometry(.055,14,10),M(k?'#8fc7b3':'#6fae9c',{roughness:.2}),x,y,.68));
  const tassel=add(new THREE.ConeGeometry(.08,.34,12),M('#2f55b5'),.05,.14,.68);
  // 팔(소매)과 앞발 — 탁자 위에 올림
  const arm=(sx)=>{const g=new THREE.Group();g.position.set(sx*.62,1.02,.15);root.add(g);
    const sl=add(new THREE.CylinderGeometry(.17,.26,.95,20),cream,0,-.42,0,g);sl.rotation.x=.0;
    const cuff=add(new THREE.TorusGeometry(.24,.04,8,24),navy,0,-.88,0,g);cuff.rotation.x=Math.PI/2;
    const pw=add(new THREE.SphereGeometry(.17,20,16),fur2,0,-.98,.05,g);pw.scale.set(1,.7,1.3);
    g.rotation.x=-1.05;g.rotation.z=sx*.12;return g};
  const pawL=arm(-1),pawR=arm(1);
  // 꼬리
  const tail=add(new THREE.SphereGeometry(.22,16,12),fur,.95,.15,-.35);tail.scale.set(1.8,.7,.8);tail.rotation.z=.4;
  // 머리
  const head=new THREE.Group();head.position.set(0,1.95,.05);root.add(head);
  const skull=add(new THREE.SphereGeometry(.56,40,30),fur,0,0,0,head);skull.scale.set(1,.95,.95);
  add(new THREE.SphereGeometry(.42,30,24),fur2,0,-.2,.22,head).scale.set(1.05,.8,.8);
  const muz=add(new THREE.SphereGeometry(.24,30,24),fur2,0,-.2,.47,head);muz.scale.set(1.1,.78,1);
  add(new THREE.SphereGeometry(.09,20,16),black,0,-.12,.7,head).scale.set(1.25,.85,.9);
  const mouth=add(new THREE.TorusGeometry(.06,.012,6,16,Math.PI),black,0,-.3,.66,head);mouth.rotation.z=Math.PI;
  const eyes=[-1,1].map(s=>{const e=add(new THREE.SphereGeometry(.085,20,16),black,s*.2,.06,.47,head);
    add(new THREE.SphereGeometry(.022,8,8),M('#ffffff',{emissive:'#ffffff',emissiveIntensity:.6}),s*.2+.03,.1,.55,head);return e});
  // 반쯤 접힌 귀 — 위로 서다 끝이 앞으로 접힘
  const ear=(s)=>{const g=new THREE.Group();g.position.set(s*.36,.42,-.02);g.rotation.z=-s*.35;head.add(g);
    const base=add(new THREE.ConeGeometry(.2,.36,4),fur,0,.14,0,g);base.scale.set(1,1,.35);
    const tip=new THREE.Group();tip.position.set(0,.3,0);g.add(tip);const t=add(new THREE.ConeGeometry(.17,.28,4),M('#d29d63'),0,.12,0,tip);t.scale.set(1,1,.32);tip.rotation.x=1.25;
    return g};
  const ears=[ear(-1),ear(1)];
  // 도사 모자(검은 갓 느낌, 금 끈)
  const hat=new THREE.Group();hat.position.set(0,.5,0);head.add(hat);
  add(new THREE.CylinderGeometry(.78,.78,.03,48),M('#0f0f14',{roughness:.5,transparent:true,opacity:.92}),0,0,0,hat);
  add(new THREE.CylinderGeometry(.26,.3,.42,32),M('#0f0f14',{roughness:.5,transparent:true,opacity:.92}),0,.22,0,hat);
  add(new THREE.TorusGeometry(.3,.02,8,32),gold,0,.03,0,hat).rotation.x=Math.PI/2;

  function update(t,dt){
    // 시선: 포인터 쪽을 부드럽게 바라봄
    head.rotation.y+=((S.look.x*.35)-head.rotation.y)*.06;head.rotation.x+=((-S.look.y*.15+.05)-head.rotation.x)*.06;

    if(st.shuffle>0){st.shuffle-=dt;pawL.rotation.x=-1.05+Math.sin(t*16)*.18;pawR.rotation.x=-1.05+Math.sin(t*16+Math.PI)*.18}
    else if(st.gest>0){st.gest-=dt;const k=Math.sin(Math.min(1,st.gest)*Math.PI);pawR.rotation.x=-1.05-k*.6;pawR.rotation.z=.12-k*.3;pawL.rotation.x+=(-1.05-pawL.rotation.x)*.1}
    else{pawR.rotation.x+=(-1.05-pawR.rotation.x)*.1;pawL.rotation.x+=(-1.05-pawL.rotation.x)*.1;pawR.rotation.z+=(.12-pawR.rotation.z)*.1}
  }

  const halo=new THREE.Mesh(new THREE.CircleGeometry(1.25,48),new THREE.MeshBasicMaterial({color:'#e2b866',transparent:true,opacity:.14,depthWrite:false}));halo.position.set(0,Hh*.82,-.05);root.add(halo);

function runTweens(dt){for(let k=tweens.length-1;k>=0;k--){const w=tweens[k];if(w.delay>0){w.delay-=dt;continue}

  w.t+=dt;const p=ease(Math.min(1,w.t/w.dur)),f=w.from,to=w.to,L=(a,b)=>b===undefined?a:a+(b-a)*p;
  w.o.position.set(L(f.px,to.px),L(f.py,to.py),L(f.pz,to.pz));w.o.rotation.set(L(f.rx,to.rx),L(f.ry,to.ry),L(f.rz,to.rz));if(to.s!==undefined)w.o.scale.setScalar(L(f.s,to.s));

  R.items.forEach((it,k)=>{const r=Math.floor(k/per),col=k%per,cnt=Math.min(per,n-r*per),x=W/2+(col-(cnt-1)/2)*(cw+24),y=y0+r*(chh+70);
    const fc=faceCanvas(it.card);g.save();g.translate(x,y+chh/2);if(it.rev)g.rotate(Math.PI);g.drawImage(fc,-cw/2,-chh/2,cw,chh);g.restore();
    g.fillStyle='#e2b866';g.font=`${n>5?20:24}px "Gowun Dodum",sans-serif`;g.fillText(`${it.pos}${it.rev?' · 역':''}`,x,y+chh+34)});
  let y=y0+rows*(chh+70)+40;g.textAlign='left';
  const block=(title,txt,lines)=>{g.fillStyle='#e2b866';g.font='bold 34px "Gowun Batang",serif';g.fillText(title,90,y);y+=50;g.fillStyle='#f4ecdb';g.font='32px "Gowun Dodum",sans-serif';y=wrapText(g,txt,90,y,W-180,46,lines)+18};
  block('전체 운세',R.summary,5);block('카드의 조합',R.combo,3);block('앞으로의 흐름',R.flow,3);block('설이의 조언',R.advice,2);
  const face=await loadImg(SEOL_HEAD);if(face){const s=300;g.save();g.beginPath();g.arc(W/2,H-330,s/2,0,7);g.fillStyle='#f4ecdb';g.fill();g.clip();g.drawImage(face,W/2-s*.62,H-330-s*.42,s*1.24,s*1.24*face.height/face.width);g.restore();g.strokeStyle='#e2b866';g.lineWidth=5;g.beginPath();g.arc(W/2,H-330,s/2,0,7);g.stroke()}
  g.textAlign='center';g.fillStyle='#f4ecdb';g.font='34px "Gowun Batang",serif';wrapText(g,R.lastWord,W/2,H-140,W-200,44,2);
  g.fillStyle='#8f88a6';g.font='24px "Gowun Dodum",sans-serif';g.fillText('재미로 보는 타로 · 설이네 스튜디오',W/2,H-70);
  return new Promise(r=>c.toBlob(r,'image/png'));
}
function openSetup(){ST.phase='setup';hint('');paintSetup();show('#setup',true);$('#topbtn').style.display='block';say('어서 오세요. 무엇이 궁금하신가요?')}
function openHistory(){let h=[];try{h=JSON.parse(localStorage.getItem('seoltarot')||'[]')}catch(e){}
  $('#histIn').innerHTML=`<h2>상담 기록</h2>${h.length?h.map(r=>`<div class="hist"><div class="pos">${new Date(r.at).toLocaleString('ko-KR',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})} · ${esc(r.mode)} · ${esc(r.cat)}</div><div>${esc(r.cards.join(', '))}</div>${r.q?`<div class="kw">질문: ${esc(r.q)}</div>`:''}<div class="kw">조언: ${esc(r.advice)}</div></div>`).join(''):'<p class="kw">아직 기록이 없어요. 이 브라우저에만 저장돼요.</p>'}
   <div class="row"><button class="gold" id="histClose">닫기</button></div>`;
  show('#history',true);$('#histClose').onclick=()=>show('#history',false)}
$('#topbtn').onclick=openHistory;
$('#shuffleBtn').onclick=deal;
$('#readBtn').onclick=()=>{if(ST.picks.length)reveal()};
$('#startBtn').onclick=()=>{audio();$('#snd').style.display='block';$('#start').hidden=true;openSetup()};
$('#snd').onclick=()=>{SND.on=!SND.on;audio();if(SND.m)SND.m.gain.value=SND.on?.6:0;$('#snd').textContent=SND.on?'소리 켬':'소리 끔';$('#snd').setAttribute('aria-pressed',SND.on)};
document.addEventListener('pointerdown',()=>{if(SND.ctx&&SND.on){audio()}},true);
const cvs=document.getElementById('gl');
cvs.addEventListener('pointermove',e=>{S.look.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1)});
cvs.addEventListener('pointerdown',e=>{S.look.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);pickAt(e.clientX,e.clientY)});

/* ============ 10. 루프 ============ */
let last=performance.now(),T=0;
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;
  runTweens(dt);S.master.update(T,dt);
  S.candles.forEach(c=>{const f=1+Math.sin(T*9+c.ph)*.08+Math.sin(T*23+c.ph)*.05;c.l.intensity=.9*f;c.f.scale.set(f,1.8*f,f)});
  S.ballLight.intensity=.5+Math.sin(T*1.5)*.2;S.ball.rotation.y+=dt*.2;S.circ.rotation.z+=dt*.03;
  S.dust.rotation.y+=dt*.01;S.dust.position.y=Math.sin(T*.3)*.1;
  for(let k=S.bursts.length-1;k>=0;k--){const b=S.bursts[k];b.life-=dt;const a=b.pts.geometry.attributes.position;
    for(let j=0;j<b.vel.length;j++){b.vel[j].y-=dt*2.5;a.array[j*3]+=b.vel[j].x*dt;a.array[j*3+1]+=b.vel[j].y*dt;a.array[j*3+2]+=b.vel[j].z*dt}
    a.needsUpdate=true;b.pts.material.opacity=Math.max(0,b.life);if(b.life<=0){S.sc.remove(b.pts);S.bursts.splice(k,1)}}
  // 선택 대기 카드: 살짝 떠오르는 숨쉬기
  if(ST.phase==='pick')ST.spread.forEach((c,k)=>{if(!c.picked&&!tweens.some(w=>w.o===c.g))c.g.position.y=.04+k*.002+Math.max(0,Math.sin(T*2+k*.5))*.03});
  if(sayT>0){sayT-=dt;if(sayT<=0)$('#say').classList.remove('on')}
  S.r.render(S.sc,S.cam);requestAnimationFrame(loop)}
function boot(){
  if(!window.THREE){$('#loading').textContent='3D를 불러오지 못했어요. 새로고침해 주세요.';return}
  try{initScene()}catch(e){$('#loading').textContent='이 기기에서는 3D를 켤 수 없어요.';return}
  $('#loading').remove();$('#start').hidden=false;requestAnimationFrame(loop);setTimeout(()=>say('멍. 설이네 타로에 오신 걸 환영해요.'),600)}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(boot,boot);else boot();
}
